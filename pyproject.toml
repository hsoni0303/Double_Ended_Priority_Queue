[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depq"
version = "1.0.0"
description = "Double-ended priority queue using corresponding min/max heaps"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Hemant Soni" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
